[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homevpn"
version = "0.1.0"
description = "HomeVpn: VPN-инфраструктура, QEMU/KVM и проброс PCI/GPU"
requires-python = ">=3.12"
dependencies = [
    "pystun3==2.0.0",
    "python-iptables==1.2.0",
    "psutil==7.0.0",
    "netaddr==1.3.0",
    "randmac==0.1",
    "semantic_version==2.10.0",
    "os-release==1.0.1",
    "requests==2.32.4",
    "grequests==0.7.0",
    "PySocks==1.7.1",
    "py-cpuinfo==9.0.0",
    "python-crontab==3.2.0",
    "filelock==3.18.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pylint==4.1.3",
    "types-python-crontab==3.4.0.20260901",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]

[tool.mypy]
python_version = "3.12"
files = ["main.py", "lib/python"]
mypy_path = "."
explicit_package_bases = true
strict = true
warn_unreachable = true
disallow_any_unimported = true
disallow_untyped_globals = true
pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
warn_unused_configs = true

[tool.pylint.main]
py-version = "3.12"
jobs = 0
persistent = false
recursive = true
ignore-paths = ["^\\.venv/", "^data/", "^logs/"]
init-hook = "import sys; sys.path.insert(0, '.')"

[tool.pylint.messages_control]
enable = ["all"]
disable = []

[tool.pylint.design]
min-public-methods = 1

[tool.pylint.format]
max-line-length = 120
